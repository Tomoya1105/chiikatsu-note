<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>X埋め込みテスト</title>
<style>body{font:15px/1.6 sans-serif;padding:16px;max-width:560px;margin:auto}li{margin:6px 0}.ok{color:#087a2e}.ng{color:#b3261e}.w{color:#777}button{font-size:16px;padding:10px 16px}</style></head><body>
<h1>X埋め込みテスト</h1><p>ボタンを押すと、Xの読み込みを順に確認します（約1〜2分）。結果の画面を、そのまま送ってください。</p>
<button id="go">テスト開始</button><ol id="o"></ol><pre id="sum"></pre>
<script>
var IDS=["1967861011546804495", "2004749845605875758", "2018861973136703968", "2045321417575776461", "2056622381393965225", "2064548449224413331", "2084157319114621084", "2084569969304760322", "2094258886781927591", "2094621282461532543", "2100797269436203365", "2103318588304343206", "2103417374833827878", "2104405989185491226", "2104481246151909590", "2105587349849862280", "2105825095625195662", "2105855302738587873", "2106912254197383508", "2108074916067312094"],CONTROL="20";
var o=document.getElementById("o"),sum=document.getElementById("sum");
function line(t,c){var l=document.createElement("li");l.className=c||"w";l.textContent=t;o.appendChild(l);return l}
function loadScript(){return new Promise(function(res,rej){var s=document.createElement("script");s.src="https://platform.twitter.com/widgets.js";s.async=true;s.onload=function(){res()};s.onerror=function(){rej()};document.head.appendChild(s);setTimeout(function(){rej()},12000)})}
function one(id,label){return new Promise(function(res){var d=document.createElement("div");d.style.cssText="height:0;overflow:hidden";document.body.appendChild(d);var done=false;
 var t=setTimeout(function(){if(!done){done=true;res("時間切れ")}},10000);
 twttr.widgets.createTweet(id,d,{dnt:true,conversation:"none",lang:"ja"}).then(function(el){if(done)return;done=true;clearTimeout(t);res(el?"表示OK":"投稿が見つからない/表示不可")}).catch(function(){if(!done){done=true;res("エラー")}})})}
document.getElementById("go").onclick=async function(){this.disabled=true;o.innerHTML="";var ua=navigator.userAgent;line("端末: "+ua.slice(0,90));
 try{await loadScript();line("① Xの部品の読み込み: OK","ok")}catch(e){line("① Xの部品の読み込み: 失敗（広告/トラッキング対策で止められている可能性）","ng");return}
 await new Promise(function(r){twttr.ready(function(){r()})});line("② 初期化: OK","ok");
 var c=await one(CONTROL,"対照");line("③ 対照（Xの最初の公開投稿）: "+c,c==="表示OK"?"ok":"ng");
 var okc=0,ngc=0,bad=[];
 for(var i=0;i<IDS.length;i++){var r=await one(IDS[i]);var l=line("④ ちい活の投稿 "+(i+1)+"/"+IDS.length+" ("+IDS[i].slice(-6)+"): "+r,r==="表示OK"?"ok":"ng");if(r==="表示OK")okc++;else{ngc++;bad.push(IDS[i])}}
 sum.textContent="まとめ: 対照="+c+" / 表示OK="+okc+" / 表示NG="+ngc;
};
</script></body></html>
