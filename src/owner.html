<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>運営者メニュー｜ちい活ノート</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
:root{--bg:#FBF6F8;--surface:#fff;--ink:#3A3346;--ink-2:#6D6479;--acc:#E27496;--on:#fff;--soft:#FBE3EB;--line:#EEDDE5;--ok:#3C9A6E}
@media (prefers-color-scheme:dark){:root{--bg:#1F1A21;--surface:#2B2430;--ink:#F1ECF6;--ink-2:#C2B9CE;--acc:#F095B0;--on:#2A1720;--soft:#3E2C36;--line:#443A46;--ok:#7FD3A7}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.7}
.w{max-width:560px;margin:0 auto;padding:20px 16px 50px}
h1{font-size:20px;margin:0 0 4px}
.lead{color:var(--ink-2);font-size:13px;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 4px}
.card p{font-size:13px;color:var(--ink-2);margin:0 0 10px}
textarea{width:100%;font:inherit;font-size:15px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.btn{display:block;width:100%;font:inherit;font-weight:700;font-size:15px;border:none;border-radius:12px;padding:12px;margin-top:10px;cursor:pointer;text-align:center;text-decoration:none}
.go{background:var(--acc);color:var(--on)}
.sub{background:var(--soft);color:var(--ink)}
.msg{font-size:13px;margin-top:8px;min-height:1em}
.msg.ok{color:var(--ok);font-weight:700}
ol{margin:0 0 4px;padding-left:20px;font-size:13.5px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.kpi div{background:var(--bg);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:20px}
.kpi span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.kpi small{display:block;font-size:11px;color:var(--ink-2);line-height:1.4;margin-top:2px}
.seg{display:flex;gap:6px;margin:4px 0 6px}
.seg button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:4px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--on);border-color:var(--acc)}
.bars{display:flex;align-items:flex-end;gap:3px;height:60px;margin-top:10px}
.bars i{flex:1;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.note{font-size:12px;color:var(--ink-2);margin-top:8px}
.ng{text-align:center;padding:30px 10px;color:var(--ink-2)}
.seg .gap{flex:0 0 10px}
.health{font-size:13px;border-radius:12px;padding:10px 12px;margin:6px 0 10px;line-height:1.6}
.health.ok{background:var(--soft)}.health.warn{background:#FFF3D6;color:#6B4E00}.health.bad{background:#FFE1E1;color:#8A1F1F}
.health small{font-size:11.5px;opacity:.85}
.card h3{font-size:13.5px;margin:14px 0 2px}
.note.warn{color:#8A5A00}
.tb{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}.tb th,.tb td{border-bottom:1px solid var(--line);padding:5px 3px;text-align:right}.tb th:first-child{text-align:left}
.top{font-size:13px;padding-left:20px;margin:4px 0}.top a{color:var(--ink)}
.bars i.stop{background:#C9A227}.bars i.none{background:var(--line)}
.legacy{margin-top:14px;font-size:13px}.legacy summary{cursor:pointer;color:var(--ink-2)}
code{font-size:11.5px;word-break:break-all}
</style>
</head>
<body>
<div class="w" id="app"><p class="ng">読み込み中…</p></div>
<script>
(function(){
  var K = "chiikatsu-owner", t = "";
  var m = /[#&]k=([A-Za-z0-9_-]{10,})/.exec(location.hash);
  if (m) { t = m[1]; try { localStorage.setItem(K, t); } catch (e) {} }
  else { try { t = localStorage.getItem(K) || ""; } catch (e) {} }
  var app = document.getElementById("app");
  if (!t) { app.innerHTML = '<p class="ng">このページは運営者専用です。</p>'; return; }
  function call(op, extra){
    var body = { t: t, op: op }; for (var k in extra) body[k] = extra[k];
    return fetch("/api/owner", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }).then(function(r){ return r.json(); });
  }
  app.innerHTML =
    '<h1>運営者メニュー</h1><p class="lead">ちい活ノートの運営者だけが使うページです。このページをホーム画面に追加しておくと便利です。</p>' +
    '<div class="card"><h2>数字を見る</h2><div id="health"></div><div class="seg" id="seg"><button type="button" data-r="7" aria-pressed="true">7日間</button><button type="button" data-r="28" aria-pressed="false">28日間</button><span class="gap"></span><button type="button" data-g="g" aria-pressed="true">一般</button><button type="button" data-g="t" aria-pressed="false">テスト</button></div><div id="kpi"><p>読み込み中…</p></div><div id="tm"></div><details class="legacy" id="legacy"></details></div>' +
    '<div class="card"><h2>見つけた情報を送る</h2><p>Xなどで見つけた新商品・イベント・話題のグッズの投稿URLを貼ってください。本文もコピーして貼ると、より確実です。次の自動更新で確かめてサイトに載せます。</p>' +
    '<form id="tip"><textarea name="text" rows="5" maxlength="2000" required placeholder="ここに貼り付け"></textarea><button class="btn go" type="submit">送る</button><div class="msg" id="tipmsg"></div></form></div>' +
    '<div class="card"><h2>投稿案・お問い合わせを見る</h2><p>自動更新が作ったXの投稿案と、お問い合わせフォームに届いた内容を見られます。</p><button class="btn sub" type="button" id="drafts">運営者ページを開く</button><div class="msg" id="dmsg"></div></div>' +
    '<div class="card"><h2>投稿案の通知を、このスマホで受け取る</h2><ol><li>ホーム画面の「ちい活ノート」アプリを開き、マイリストの通知の<b>「テスト通知を送る」</b>を押す</li><li>10分以内にこのページに戻って、下のボタンを押す</li></ol><button class="btn sub" type="button" id="claim">通知を登録する</button><div class="msg" id="cmsg"></div></div>';
  var ST = null, LG = null, R = 7, G = "g", NAMES = {};
  function esc(x){ return String(x == null ? "" : x).replace(/[&<>"]/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function pct(a, b){ return b ? Math.round(a / b * 1000) / 10 + "%" : "—"; }
  // 割合は必ず「分子/分母」を添える。分母が20未満のときは「参考」
  function rate(a, b, unit){ if (a > b && b) return '<b>—</b><small>' + a + ' / ' + b + (unit || '') + '（分子が分母を超えたため、割合は出しません。計測の欠けか、複数タブの重なり）</small>'; if (!b) return '<b>—</b><small>まだ分母がありません</small>'; return '<b>' + pct(a, b) + '</b><small>' + a + ' / ' + b + (unit || '') + (b < 20 ? '（件数が少ないため参考）' : '') + '</small>'; }
  function jst(ms){ return new Date(ms + 9 * 3600e3).toISOString().slice(0, 10); }
  function monday(ms){ var d = new Date(ms + 9 * 3600e3), w = (d.getUTCDay() + 6) % 7; return jst(ms - w * 864e5); }
  // 期間・区分の合計
  function sums(days, seg, from, to){
    var o = {}; (ST.rows || []).forEach(function(r){ if (r[1] === seg && r[0] >= from && r[0] <= to) o[r[2]] = (o[r[2]] || 0) + r[3]; }); return o;
  }
  function v(o, k){ return o[k] || 0; }
  function sumPre(o, pre){ var n = 0; for (var k in o) if (k.indexOf(pre) === 0) n += o[k]; return n; }
  function drawHealth(){
    var el = document.getElementById("health"), s = ST, h = "", cls = "ok";
    var today = s.days && s.days[0];
    if (!s.binding) { cls = "bad"; h = "計測のデータベースがつながっていません。いまは記録されていません。"; }
    else if (!s.ok) { cls = "bad"; h = "計測のデータベースに接続できません（" + esc(s.dbErr || "") + "）。いまは記録されていない可能性があります。"; }
    else if (s.env !== s.want) { cls = "bad"; h = "つないでいるデータベースの設定が、この画面（" + (s.want === "production" ? "本番" : "確認用") + "）と合っていません（" + esc(s.env || "未設定") + "）。記録していません。"; }
    else {
      h = "計測：正常" + (today && today.last ? "（今日の最終記録 " + esc(today.last.slice(11)) + "）" : "（今日はまだ記録がありません）");
      if (today && today.mode === 1) { cls = "warn"; h = "今日は書き込みが多いため、" + esc((today.modeAt || "").slice(11)) + "から大事な項目だけを記録しています（ページ表示などは省略）。"; }
      if (today && today.mode === 2) { cls = "bad"; h = "今日は上限に達したため、" + esc((today.modeAt || "").slice(11)) + "から記録を止めています（あすの0時に再開）。"; }
      if (today) h += '<br><small>今日の計測の書き込み：' + today.w.toLocaleString() + '行（縮小 ' + s.limits.reduce.toLocaleString() + '行・停止 ' + s.limits.stop.toLocaleString() + '行。Cloudflareが数えた行数）</small>';
    }
    if (s.err && Date.now() - s.err.ms < 48 * 3600e3) h += '<br><small>直近のエラー：' + esc(s.err.at) + ' ' + esc(s.err.msg) + '</small>';
    el.className = "health " + cls; el.innerHTML = h;
  }
  function drawStats(){
    if (!ST) return;
    drawHealth();
    var el = document.getElementById("kpi"), now = Date.now(), to = ST.today, from = jst(now - (R - 1) * 864e5);
    var o = sums(ST.rows, G, from, to);
    var days = ST.days.slice(0, R), cut = days.filter(function(d){ return d.mode === 2; }), red = days.filter(function(d){ return d.mode === 1; });
    var wk0 = monday(now), wk1 = monday(now - 7 * 864e5), wkEnd1 = jst(new Date(wk0 + "T00:00:00Z").getTime() - 864e5);
    var tw = sums(ST.rows, G, wk0, to), lw = sums(ST.rows, G, wk1, wkEnd1);
    var sec = function(t, rows){ return '<h3>' + t + '</h3><div class="kpi">' + rows.map(function(r){ return '<div>' + r[0] + '<span>' + r[1] + '</span>' + (r[2] ? '<small>' + r[2] + '</small>' : '') + '</div>'; }).join("") + '</div>'; };
    var n = function(x){ return '<b>' + x.toLocaleString() + '</b>'; };
    var h = "";
    if (cut.length || red.length) h += '<p class="note warn">この期間には、上限で' + (cut.length ? '記録を止めた日（' + cut.map(function(d){ return d.day.slice(5); }).join("・") + '）' : '') + (cut.length && red.length ? 'と、' : '') + (red.length ? 'ページ表示などを省いた日（' + red.map(function(d){ return d.day.slice(5); }).join("・") + '）' : '') + 'があります。止めた日の数字は、止まるまでの分だけです。推定で補っていません。</p>';
    h += sec("利用", [
      [n(v(tw, "u:wk")), "今週使ったブラウザ（月曜から）", "先週：" + v(lw, "u:wk") + "。ブラウザごとに1つ（X内とSafariは別）。履歴を消すと重ねて数える"],
      [rate(v(tw, "u:wkret"), v(tw, "u:wk")), "今週のうち、先週も開いたブラウザ", "同じブラウザで続けて開いた分だけ（参考値）"],
      [n(v(o, "v:new")), "訪問", "同じタブで開いている間のひとまとまり（30分あくと次の訪問）"],
      [n(sumPre(o, "pv:")), "ページ表示", "トップ " + v(o, "pv:home") + "・詳細 " + v(o, "pv:item") + "・その他 " + v(o, "pv:other")]
    ]);
    h += sec("行動の流れ（訪問ごと）", [
      [rate(v(o, "f:hi"), v(o, "f:h"), "訪問"), "トップ → 詳細", "トップを見たあと、同じ訪問で詳細ページを開いた"],
      [rate(v(o, "f:ib"), v(o, "f:i"), "訪問"), "詳細 → 購入先", "詳細ページで購入先（公式通販・公式の予約・楽天・Yahoo!）を押した"],
      [rate(v(o, "f:lb"), v(o, "f:h"), "訪問"), "一覧 → 購入先", "トップの一覧から直接、購入先を押した"],
      [rate(v(o, "f:w"), v(o, "v:new"), "訪問"), "♡を使った訪問", "「ほしい」か♡を1回以上押した（初回も含む）"]
    ]);
    var PL = [["list", "一覧"], ["item", "詳細"], ["mine", "マイリスト"], ["shop", "おすすめ"], ["sum", "まとめ"]], DS = [["off", "公式通販"], ["rsv", "公式の予約"], ["rk", "楽天"], ["yh", "Yahoo!"]];
    h += '<h3>購入先へのクリック（回数）</h3><table class="tb"><tr><th></th>' + DS.map(function(d){ return '<th>' + d[1] + '</th>'; }).join("") + '<th>計</th></tr>' +
      PL.map(function(p){ var t = 0; return '<tr><th>' + p[1] + '</th>' + DS.map(function(d){ var x = v(o, "b:" + p[0] + ":" + d[0]); t += x; return '<td>' + x + '</td>'; }).join("") + '<td><b>' + t + '</b></td></tr>'; }).join("") + '</table>' +
      '<p class="note">回数なので、同じ人が何度押しても数えます。実際の購入・報酬は、楽天・もしもの管理画面の成果で確かめてください。公式情報（購入先ではない公式リンク）：' + v(o, "o:info") + '回</p>';
    var top = Object.keys(o).filter(function(k){ return k.indexOf("bi:") === 0; }).sort(function(a, b){ return o[b] - o[a]; }).slice(0, 10);
    if (top.length) h += '<h3>商品別の購入先クリック（上位10）</h3><ol class="top">' + top.map(function(k){ var id = k.slice(3); return '<li><a href="/items/' + encodeURIComponent(id) + '/" target="_blank">' + esc(NAMES[id] || id) + '</a> <b>' + o[k] + '</b></li>'; }).join("") + '</ol>';
    h += sec("集客と定着", [
      [rate(v(o, "v:x"), v(o, "v:new"), "訪問"), "Xのリンクから来た訪問", "utm_source=x 付きのリンク"],
      [rate(v(o, "f:xi"), v(o, "v:x"), "訪問"), "Xから来て詳細を見た", "購入先：" + v(o, "f:xb") + "訪問・♡：" + v(o, "f:xw") + "訪問"],
      [rate(v(o, "ob:done"), v(o, "ob:show"), "回"), "ご案内を最後まで見た", "スキップ " + v(o, "ob:skip") + "・閉じる " + v(o, "ob:close") + "・「使い方」から " + v(o, "ob:help") + "回"],
      [rate(v(o, "v:hs"), v(o, "v:new"), "訪問"), "ホーム画面のアイコンから開いた訪問", "アイコンから使った端末（日ごと）：" + v(o, "u:app")],
      [rate(v(o, "u:fav"), v(o, "u:dev"), "端末・日"), "♡を持っている端末", "その日に押した分も含む（端末×日で数える）"],
      [n(v(o, "push:on")), "通知をオンにした回数", "共有ボタン：" + (v(o, "share:line") + v(o, "share:x") + v(o, "share:copy") + v(o, "share:nudge")) + "回"]
    ]);
    var mx = 1, bars = ST.days.slice(0, 14).map(function(d){ var x = 0; (ST.rows || []).forEach(function(r){ if (r[0] === d.day && r[1] === G && r[2] === "v:new") x += r[3]; }); if (x > mx) mx = x; return [d, x]; });
    h += '<div class="bars" title="直近14日の訪問">' + bars.reverse().map(function(b){ var d = b[0], st = d.mode === 2 ? " stop" : (!d.w && b[1] === 0 ? " none" : ""); return '<i class="' + st + '" style="height:' + Math.max(3, Math.round(b[1] / mx * 100)) + '%" title="' + d.day + '：' + b[1] + '訪問' + (d.mode === 2 ? '（途中で停止）' : '') + (!d.w ? '（記録なし）' : '') + '"></i>'; }).join("") + '</div>';
    var none = ST.days.slice(0, R).filter(function(d){ return !d.w && d.day !== ST.today; });
    h += '<p class="note">棒は直近14日の訪問（左が古い日）。' + (G === "t" ? "いまは「テスト」の数字を表示しています。" : "テストモードの端末の数字は含みません。") + (none.length && ST.ok ? '記録が1件もない日：' + none.map(function(d){ return d.day.slice(5); }).join("・") + '（アクセスがなかったか、計測が止まっていた日。上の「直近のエラー」も確認）' : '') + '</p>';
    el.innerHTML = h;
  }
  function drawTm(){
    var on = false; try { var t = JSON.parse(localStorage.getItem("chiikatsu-test") || "null"); on = !!(t && t.on && Date.now() - (t.at || 0) < 30 * 864e5); } catch (e) {}
    document.getElementById("tm").innerHTML = '<p class="note">この端末のテストモード：<b>' + (on ? "オン" : "オフ") + '</b>（オンの間は、サイトの左下に「テスト中」と出ます。30日で自動でオフ。お友達には <code>https://chiikatsunote.com/?test=on</code> を送ってください）</p><button type="button" class="btn sub" id="tmBtn">' + (on ? "この端末のテストモードをやめる" : "この端末をテストモードにする") + '</button>';
    document.getElementById("tmBtn").onclick = function(){ try { if (on) localStorage.removeItem("chiikatsu-test"); else localStorage.setItem("chiikatsu-test", JSON.stringify({ on: 1, at: Date.now() })); } catch (e) {} drawTm(); };
  }
  function drawLegacy(){
    var el = document.getElementById("legacy"), d = LG;
    if (!d) { el.hidden = true; return; }
    el.innerHTML = '<summary>参考：旧方式の数字（' + esc(d.from.slice(5)) + '〜' + esc(d.to.slice(5)) + '・テストを含む・定義がちがう）</summary><p class="note">新しい数字とは比べないでください。「使った人」は端末×日の合計、「訪問」はページ表示の回数、「ほしい登録率」はその日に押した♡を数えない方式でした。</p>' +
      '<div class="kpi">' + [[d.dev, "使った人（端末×日）"], [d.visits, "ページ表示"], [pct(d.ret, d.dev), "再訪（端末×日）"], [pct(d.fav, d.dev), "♡がある端末（旧）"], [pct(d.push, d.dev), "通知許可（端末×日）"], [d.aff, "アフィリエイトのクリック（楽天" + d.rk + "・Yahoo!" + d.yahoo + "・Amazon" + d.amazon + "）"], [d.want, "♡が押された回数"], [d.share, "共有ボタン"]].map(function(r){ return '<div><b>' + r[0] + '</b><span>' + r[1] + '</span></div>'; }).join("") + '</div>';
  }
  document.getElementById("seg").addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.r) { R = +b.dataset.r; [].forEach.call(this.querySelectorAll("[data-r]"), function(x){ x.setAttribute("aria-pressed", x === b); }); }
    if (b.dataset.g) { G = b.dataset.g; [].forEach.call(this.querySelectorAll("[data-g]"), function(x){ x.setAttribute("aria-pressed", x === b); }); }
    drawStats();
  });
  drawTm();
  fetch("/push-items.json").then(function(r){ return r.json(); }).then(function(a){ a.forEach(function(x){ NAMES[x.id] = x.t; }); drawStats(); }).catch(function(){});
  call("stats").then(function(j){ if (j.ok) { ST = j.stats; LG = j.legacy; drawStats(); drawLegacy(); } else document.getElementById("kpi").innerHTML = "<p>" + (j.reason || "読み込めませんでした") + "</p>"; }).catch(function(){ document.getElementById("kpi").innerHTML = "<p>読み込めませんでした</p>"; });
  document.getElementById("tip").addEventListener("submit", function(e){
    e.preventDefault(); var f = e.target, ms = document.getElementById("tipmsg");
    ms.className = "msg"; ms.textContent = "送信中…";
    call("tip", { text: f.text.value }).then(function(j){
      if (j.ok) { f.reset(); ms.className = "msg ok"; ms.textContent = "送りました。次の自動更新で確かめます"; }
      else ms.textContent = j.reason || "送れませんでした";
    }).catch(function(){ ms.textContent = "送れませんでした。通信を確かめてください"; });
  });
  document.getElementById("drafts").addEventListener("click", function(){
    var ms = document.getElementById("dmsg"); ms.textContent = "開いています…";
    call("page").then(function(j){ if (j.ok) location.href = j.url; else ms.textContent = j.reason || "開けませんでした"; }).catch(function(){ ms.textContent = "開けませんでした"; });
  });
  document.getElementById("claim").addEventListener("click", function(){
    var ms = document.getElementById("cmsg"); ms.className = "msg"; ms.textContent = "登録中…";
    call("claim").then(function(j){
      if (j.ok) { ms.className = "msg ok"; ms.textContent = j.sent ? "登録しました。確認の通知を送りました" : "登録しました"; }
      else ms.textContent = j.reason || "登録できませんでした";
    }).catch(function(){ ms.textContent = "登録できませんでした"; });
  });
})();
</script>
</body>
</html>
